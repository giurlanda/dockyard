# Dockyard. Copy .env.example to .env, fill it in, then: docker compose up -d
# Update: docker compose pull && docker compose up -d
# The README covers the whole installation (Cloudflare Tunnel and Access, host firewall).
name: dockyard

# The Base Image: Dockyard runs it, and the base-image service below pulls it.
x-base-image: &base-image ${DOCKYARD_BASE_IMAGE:-ghcr.io/giurlanda/dockyard-base:${DOCKYARD_VERSION:-latest}}

services:
  # The only service that sees the Docker socket, read-only. It lets through only the Docker API
  # sections Dockyard needs; everything else is refused.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      EXEC: 1
      BUILD: 1
      POST: 1
      EVENTS: 0
      # PING and VERSION stay on (their default): Docker clients need them to connect.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  dockyard:
    image: ghcr.io/giurlanda/dockyard:${DOCKYARD_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKYARD_SECRET_KEY: ${DOCKYARD_SECRET_KEY:-}
      DOCKYARD_FIRST_ADMINISTRATOR_EMAIL: ${DOCKYARD_FIRST_ADMINISTRATOR_EMAIL:-}
      DOCKYARD_CF_ACCESS_TEAM: ${DOCKYARD_CF_ACCESS_TEAM:-}
      DOCKYARD_CF_ACCESS_AUD: ${DOCKYARD_CF_ACCESS_AUD:-}
      DOCKYARD_BASE_IMAGE: *base-image
      DOCKYARD_PROJECTS_DNS: ${DOCKYARD_PROJECTS_DNS:-}
      DOCKYARD_PROJECT_MAX_CPUS: ${DOCKYARD_PROJECT_MAX_CPUS:-}
      DOCKYARD_PROJECT_MAX_MEMORY_GIB: ${DOCKYARD_PROJECT_MAX_MEMORY_GIB:-}
      DOCKYARD_MAX_ACTIVE_PROJECTS: ${DOCKYARD_MAX_ACTIVE_PROJECTS:-}
    volumes:
      - dockyard-data:/data
    # No published port: people reach Dockyard through the tunnel, behind Cloudflare Access, and
    # through Local sign-in only when compose.local.yaml publishes its port.
    # docker-api reaches the socket proxy; default reaches the tunnel client and the internet
    # (Cloudflare Access signing keys).
    networks: [docker-api, default]
    depends_on: [socket-proxy]

  # The tunnel client: it connects out to Cloudflare, which sends the requests that passed
  # Cloudflare Access to http://dockyard:8000. Nothing on the host listens for them.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${DOCKYARD_CF_TUNNEL_TOKEN:?Set DOCKYARD_CF_TUNNEL_TOKEN in .env (see the README)}
    networks: [default]
    depends_on: [dockyard]

  # The Base Image every Project environment starts from. This service only pulls it with the
  # others (docker compose pull, docker compose up) and exits at once: Dockyard runs the image
  # itself, and builds again every Image of the Instance when a newer Base Image arrives.
  base-image:
    image: *base-image
    command: ["true"]
    restart: "no"
    network_mode: none

networks:
  # No internet, no published ports: only Dockyard and the socket proxy are on it.
  docker-api:
    internal: true

volumes:
  dockyard-data:
