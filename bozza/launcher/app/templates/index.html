<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Launcher</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1f1e1b; --muted: #6b6860;
    --line: #e2dfd6; --accent: #c4622d; --ok: #2f7d4f; --warn: #b7791f; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181816; --panel: #22211e; --ink: #ecebe6; --muted: #a19e95;
            --line: #36342f; --accent: #e07a43; --ok: #5cb67f; --warn: #e0a84a; --bad: #ef6b62; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 6px; padding: 8px 10px; }
  button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: wait; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .running { color: var(--ok); } .exited, .missing, .dead { color: var(--bad); } .created, .restarting, .paused { color: var(--warn); }
  .card { border-top: 1px solid var(--line); padding: 12px 0; }
  .card:first-child { border-top: 0; padding-top: 0; }
  .card h3 { font-size: 15px; margin: 0; }
  .error { color: var(--bad); white-space: pre-wrap; font-size: 13px; }
  #term-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; padding: 16px; z-index: 10; }
  #term-box { background: #111; border-radius: 10px; height: 100%; max-width: 1100px; margin: 0 auto;
              display: flex; flex-direction: column; overflow: hidden; }
  #term-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; color: #ddd; font-size: 13px; }
  #term { flex: 1; padding: 4px 8px 8px; min-height: 0; }
</style>
</head>
<body>
<main>
  <h1>Claude Code Launcher</h1>

  <section class="panel" id="claude-panel">
    <div class="row" style="justify-content: space-between">
      <div><strong>Account Claude</strong> <span id="claude-status" class="muted">controllo…</span></div>
      <button id="login-btn">Collega account Claude</button>
    </div>
    <p class="muted" style="margin:8px 0 0">Il login viene salvato nel volume condiviso da tutti i progetti.
      Dopo il primo login, apri la Console di un progetto e rispondi <code>y</code> alle conferme iniziali.</p>
  </section>

  <section class="panel">
    <h2>Nuovo progetto</h2>
    <form id="new-form">
      <div class="grid">
        <label>URL repository
          <input name="repo_url" required placeholder="https://github.com/utente/repo">
        </label>
        <label>Nome sessione
          <input name="name" required maxlength="60" placeholder="Sito web">
        </label>
        <label>Token (solo repo privati, sola lettura)
          <input name="token" type="password" autocomplete="off">
        </label>
        <label>Permessi Claude
          <select name="permission_mode">
            {% for m in permission_modes %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
          </select>
        </label>
        <label>CPU (core)
          <input name="cpu_limit" type="number" step="0.25" min="0.25" max="16" value="2">
        </label>
        <label>RAM (MB)
          <input name="mem_limit_mb" type="number" step="512" min="512" max="65536" value="4096">
        </label>
      </div>
      <p class="muted">Host ammessi: {{ git_hosts|join(", ") }}</p>
      <div class="row">
        <button class="primary" type="submit">Clona e avvia</button>
        <span id="new-msg" class="muted"></span>
      </div>
      <div id="new-err" class="error"></div>
    </form>
  </section>

  <section class="panel">
    <h2>Progetti</h2>
    <div id="projects"><p class="muted">Caricamento…</p></div>
  </section>
</main>

<div id="term-wrap">
  <div id="term-box">
    <div id="term-bar"><span id="term-title"></span><button id="term-close">Chiudi</button></div>
    <div id="term"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? {'Content-Type': 'application/json'} : {},
                                 body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || data));
  return data;
}

// ---------- progetti ----------
async function loadProjects() {
  let list;
  try { list = await api('GET', '/api/projects'); }
  catch (e) { $('#projects').innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  if (!list.length) { $('#projects').innerHTML = '<p class="muted">Nessun progetto.</p>'; return; }
  $('#projects').innerHTML = list.map((p) => `
    <div class="card" data-id="${esc(p.id)}">
      <div class="row" style="justify-content: space-between">
        <h3>${esc(p.name)} <span class="badge ${esc(p.status)}">${esc(p.status)}</span></h3>
        <span class="muted" data-stats>${p.status === 'running' ? '…' : ''}</span>
      </div>
      <p class="muted" style="margin:4px 0 8px">${esc(p.repo_url)} · ${esc(p.permission_mode)} · ${p.cpu_limit} CPU · ${p.mem_limit_mb} MB</p>
      <div class="row">
        <button data-act="console">Console</button>
        <button data-act="shell">Terminale</button>
        <button data-act="logs">Log</button>
        ${p.status === 'running'
          ? '<button data-act="stop">Stop</button><button data-act="restart">Riavvia</button>'
          : '<button data-act="start">Avvia</button>'}
        <button data-act="delete" class="danger">Elimina</button>
      </div>
    </div>`).join('');
  list.filter((p) => p.status === 'running').forEach(loadStats);
}

async function loadStats(p) {
  const el = document.querySelector(`.card[data-id="${CSS.escape(p.id)}"] [data-stats]`);
  try {
    const s = await api('GET', `/api/projects/${p.id}/stats`);
    if (el) el.textContent = `CPU ${s.cpu_percent}% · RAM ${s.mem_mb}/${s.mem_limit_mb} MB`;
  } catch { if (el) el.textContent = ''; }
}

$('#projects').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.card'), id = card.dataset.id, name = card.querySelector('h3').firstChild.textContent.trim();
  const act = btn.dataset.act;
  if (act === 'console') return openTerminal(`/ws/projects/${id}/console`,
      `Console · ${name} — non premere Ctrl+C: ferma il server`);
  if (act === 'shell') return openTerminal(`/ws/projects/${id}/shell`, `Terminale · ${name}`);
  if (act === 'logs') return openTerminal(`/ws/projects/${id}/logs`, `Log · ${name}`, true);
  try {
    btn.disabled = true;
    if (act === 'delete') {
      if (!confirm(`Eliminare il container di "${name}"?`)) return;
      const vol = confirm('Eliminare anche il codice (volume workspace)? Le modifiche non pushate andranno perse.');
      await api('DELETE', `/api/projects/${id}?delete_volume=${vol}`);
    } else {
      await api('POST', `/api/projects/${id}/${act}`);
    }
  } catch (e) { alert(e.message); }
  finally { btn.disabled = false; loadProjects(); }
});

$('#new-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target), btn = ev.target.querySelector('button[type=submit]');
  const body = Object.fromEntries(f.entries());
  body.cpu_limit = Number(body.cpu_limit); body.mem_limit_mb = Number(body.mem_limit_mb);
  if (!body.token) delete body.token;
  $('#new-err').textContent = ''; $('#new-msg').textContent = 'Clono il repository…'; btn.disabled = true;
  try {
    await api('POST', '/api/projects', body);
    ev.target.reset();
    $('#new-msg').textContent = 'Avviato. Al primo avvio apri la Console per confermare il trust della cartella.';
  } catch (e) { $('#new-msg').textContent = ''; $('#new-err').textContent = e.message; }
  finally { btn.disabled = false; loadProjects(); }
});

// ---------- login Claude ----------
async function loadClaudeStatus() {
  try {
    const s = await api('GET', '/api/claude/status');
    $('#claude-status').textContent = s.logged_in ? '· collegato' : '· non collegato';
    $('#login-btn').textContent = s.logged_in ? 'Rifai il login' : 'Collega account Claude';
  } catch (e) { $('#claude-status').textContent = '· ' + e.message; }
}

$('#login-btn').addEventListener('click', async () => {
  try {
    await api('POST', '/api/claude/login');
    openTerminal('/ws/claude/login', 'Login Claude', false, async () => {
      await api('DELETE', '/api/claude/login').catch(() => {});
      loadClaudeStatus();
    });
  } catch (e) { alert(e.message); }
});

// ---------- terminale ----------
let current = null;

function openTerminal(path, title, readonly = false, onClose = null) {
  closeTerminal();
  $('#term-title').textContent = title;
  $('#term-wrap').style.display = 'block';
  const term = new Terminal({ convertEol: readonly, cursorBlink: !readonly, fontSize: 13, scrollback: 5000 });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit); term.open($('#term')); fit.fit();
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path);
  ws.binaryType = 'arraybuffer';
  const send = (o) => ws.readyState === 1 && ws.send(JSON.stringify(o));
  const resize = () => { fit.fit(); send({ type: 'resize', cols: term.cols, rows: term.rows }); };
  ws.onopen = resize;
  ws.onmessage = (m) => term.write(typeof m.data === 'string' ? m.data : new Uint8Array(m.data));
  ws.onclose = () => term.write('\r\n\x1b[90m[connessione chiusa]\x1b[0m\r\n');
  if (!readonly) term.onData((d) => send({ type: 'input', data: d }));
  window.addEventListener('resize', resize);
  current = { term, ws, resize, onClose };
  term.focus();
}

function closeTerminal() {
  if (!current) return;
  const { term, ws, resize, onClose } = current;
  current = null;
  window.removeEventListener('resize', resize);
  ws.close(); term.dispose();
  $('#term-wrap').style.display = 'none';
  if (onClose) onClose();
}
$('#term-close').addEventListener('click', closeTerminal);

loadClaudeStatus();
loadProjects();
setInterval(loadProjects, 15000);
</script>
</body>
</html>
