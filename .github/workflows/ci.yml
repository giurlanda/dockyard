name: CI

on:
  push:
    branches: ["**"]  # a version tag runs CI from the Release workflow instead
  pull_request:
  workflow_call:  # the Release workflow publishes only what passes

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests

  seam-a:
    name: "Seam A: HTTP API"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest tests/api

  seam-b:
    name: "Seam B: Runtime contract (fake and Docker)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest tests/runtime

  seam-c:
    name: "Seam C: browser end to end"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e

  host:
    name: "Host: firewall, compose and local port"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # The tests change the runner's firewall, interfaces, network namespaces and systemd units:
      # root only.
      - run: sudo DOCKYARD_FIREWALL_TESTS=1 DOCKYARD_LOCAL_PORT_TESTS=1 .venv/bin/pytest tests/host
