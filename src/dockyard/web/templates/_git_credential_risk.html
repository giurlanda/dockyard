  <div class="warning" role="note">
    <p>{{ t("git_credential.risk") }}</p>
    <p>{{ t("git_credential.scopes") }}</p>
    <ul>
      {% for scoped in ("github", "gitlab") if not provider or provider == scoped %}
        <li>{{ t("git_credential.scopes_" ~ scoped) }}</li>
      {% endfor %}
    </ul>
  </div>
