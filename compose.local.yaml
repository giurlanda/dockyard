# Adds Local sign-in: Dockyard's own sign-in page, over HTTPS, published on one host IPv4 address
# on the LAN or VPN. Use it with compose.yaml, from .env:
#   COMPOSE_FILE=compose.yaml:compose.local.yaml
# Dockyard accepts Local sign-in only from the Local networks, never from Docker's own networks,
# and never through the tunnel (docs/adr/0004-local-sign-in-on-its-own-listener.md).
services:
  dockyard:
    environment:
      DOCKYARD_LOCAL_PORT: 8443
      DOCKYARD_LOCAL_ADDRESS: ${DOCKYARD_LOCAL_ADDRESS:?Set DOCKYARD_LOCAL_ADDRESS in .env to the host's IPv4 address on the LAN or VPN}
      DOCKYARD_LOCAL_NETWORKS: ${DOCKYARD_LOCAL_NETWORKS:-}
      DOCKYARD_LOCAL_URL: ${DOCKYARD_LOCAL_URL:-}
      DOCKYARD_LOCAL_HOST_PORT: ${DOCKYARD_LOCAL_HOST_PORT:-8443}
    # Only on the address named: an explicit IPv4 address is never published on IPv6.
    ports:
      - "${DOCKYARD_LOCAL_ADDRESS}:${DOCKYARD_LOCAL_HOST_PORT:-8443}:8443"
