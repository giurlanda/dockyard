[project]
name = "dockyard"
version = "0.1.0"
description = "Self-hosted, multi-user environments where Claude works on your repositories, driven from your phone."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bozza"]  # the draft: reference material only

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["dockyard"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A terminal that never shows what a test waits for must fail the test, not hang the suite.
# Fixtures are not timed: the first Base Image build takes minutes.
timeout = 60
timeout_func_only = true
markers = [
    "slow: needs a Docker daemon; the first run builds the Base Image (minutes)",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "types-docker>=7.2.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
