name: Release

# A version tag (v1.2.3) publishes the Dockyard image and the Base Image to GHCR, once CI passes.
# Every week the Base Image of the latest release is built again from scratch, so the Claude Code
# in it stays current: Instances get it with `docker compose pull`, and Projects move to it at
# their next restart. Only the latest release gets the weekly rebuild. GitHub turns scheduled
# workflows off after 60 days without activity in the repository: re-enable this one from the
# Actions tab.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:  # rebuilds the Base Image of the latest release now

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    name: Pick the release and its images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.release.outputs.latest }}
      registry: ${{ steps.release.outputs.registry }}
      images: ${{ steps.release.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        env:
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          # The newest release, pre-releases (v1.2.0-rc.1) aside: it is the one tagged latest.
          newest="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -v -- - | head -1 || true)"
          tag="${PUSHED_TAG:-$newest}"
          if [ -z "$tag" ]; then
            echo "::notice::No release yet: nothing to publish."
          fi
          base='{"name": "dockyard-base", "context": "images/base"}'
          if [ -n "$PUSHED_TAG" ]; then
            images="[{\"name\": \"dockyard\", \"context\": \".\"}, $base]"
          else
            images="[$base]"  # the weekly rebuild: the Dockyard image does not change
          fi
          {
            echo "tag=$tag"
            echo "latest=$([ "$tag" = "$newest" ] && echo true || echo false)"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: [ci, release]
    # A tag push waits for CI; the weekly rebuild has no CI run (ci is skipped).
    if: >-
      !cancelled() && needs.release.outputs.tag != ''
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release.outputs.images) }}
    env:
      IMAGE: ${{ needs.release.outputs.registry }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.release.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
      # The check Dockyard runs on every Image it builds, held on the Base Image before anyone
      # pulls it: Claude Code is in it and it does not run as root. The builder starts empty, so
      # nothing comes from an earlier build: Claude Code is installed again.
      - if: matrix.name == 'dockyard-base'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          pull: true
          load: true
          tags: dockyard-base:check
      - if: matrix.name == 'dockyard-base'
        run: docker run --rm dockyard-base:check bash -c 'claude --version && test "$(id -u)" != 0'
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
